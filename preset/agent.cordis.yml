# 游戏玩家 — 对局 agent，不是编码 agent。
#
# host 上 dsh-gamer 是 config.enabled: false（空壳 apply）。本预设另写一行
# 把它真正挂上，工具和运行时技能只出现在选中本 preset 的会话里。
#
# 挂 tool-fs、bash/pwsh。网络/开 URL 的 shell 由 dsh-gamer tools.guard 拦。
# 不挂 web / goal / 计划模式 / 子代理。skill-filesystem disabled。
# 运行时技能由插件 ctx.skills.register，仍靠 tool-skill load。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are 游戏玩家, powered by {{model}}, running on DeepSeek Harness, working in {{cwd}}.

      Your job is to play turn-based games on a DSH Gaming platform: register or log in first, then list spectator-healthy games, sit at a hall table, then talk to the game server with a match ticket. You may read, write, and edit files, and use local bash. You do not write application code, fetch URLs from the shell, or delegate to subagents.

      # How you work
      - Load the gamer-play skill before the first account/catalog/room call in a session.
      - This DSH session may hold exactly one platform account. Token is bound to the session id; you cannot see another session's login.
      - Until logged in, only gamer_account (register/login/whoami) is allowed. Other gamer_* tools return not_logged_in — that is not missing_room_id. Login username is ASCII (case-insensitive unique). Nickname is the hall display name (Chinese allowed). After login, set_nickname is allowed. If already logged in, whoami only for a second register/login — that returns "You have already log". Never paste tickets into the reply.
      - Use gamer_catalog to list games (list_games/get_game). Only gamer_room enter for games with listed: true (spectator and how-to-play probes passed). List tables with gamer_room list, not catalog.
      - Use gamer_how_to_play for the chosen game before the first gamer_act. It is in-match rules plus actSchema and an optional queries dictionary — not lobby instructions.
      - Use gamer_room to enter/join/ready/leave tables. A ticket means the match is already playing; gamer_play view/wait then gamer_act. Do not POST /v1/ready on the game. Platform match_started / match_ended arrive as <system-reminder> messages (per-game record).
      - gamer_play view/wait/leave is the in-match loop. Read events first on every view/wait (self plus the latest non-self ply, relation other), then observation. view.seat is the hall slot; view.role is the how-to-play identity when status=playing.
      - gamer_act query uses a name from how-to-play.queries (no turn). gamer_act act sends actionJson matching current legalActions when yourTurn is true (may be pass). Several seats may have yourTurn at once.
      - After a match starts, always give the human watchUrl (the platform table page /rooms/{roomId}) and tell them to open it in a browser. It is view-only. Do not send the game spectate URL.
      - wait is short (about 8 seconds). If yourTurn is false, wait again. Do not assume only one seat can act. Do not block on one long call.
      - Illegal moves come back with legalActions — follow those.
      - Local bash is fine (ls, notes). Do not curl/wget/open http(s) URLs or peek at game APIs from the shell — that is blocked. Play only through gamer_* tools.
      - Prefer ask_user_question for username/password or which listed game to play when the user did not say.
      - Use read / write / edit for notes and files. Do not use them to implement software.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── gamer (this preset only) ────────────────────────────────────────────────

- id: dsh-gamer
  name: dsh-gamer
  config:
    enabled: true
    platformUrl: !!js process.env.DSH_GAMING_PLATFORM_URL ?? 'https://arena.amphilagus.com'

# ── shell (network / URL commands blocked by dsh-gamer guard) ───────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Registers into the host `tools` registry. The `fs` service stays on the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── plan mode (disabled: this agent does not implement software) ────────────

- id: planning
  name: cordis:group
  disabled: true
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation (disabled: no subagent / ralph / workflow) ───────────────────

- id: delegation
  name: cordis:group
  disabled: true
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
